<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GYBS Campaign</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .campaign-page{min-height:100vh;padding:32px 18px 60px;background:var(--cream,#DCCFBC);color:var(--ink,#1B1B1B)}
    .campaign-shell{max-width:760px;margin:0 auto}.campaign-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
    .campaign-brand{font-weight:900;letter-spacing:.08em}.back-link{color:inherit;text-decoration:none;font-weight:800}
    .campaign-card{background:var(--paper,#E8DDCC);border:2px solid var(--ink,#1B1B1B);padding:28px;box-shadow:8px 8px 0 var(--ink,#1B1B1B)}
    .campaign-logo{width:110px;height:110px;object-fit:contain;border:2px solid var(--ink,#1B1B1B);background:var(--off,#FFF8EC);display:block;margin-bottom:20px}
    .campaign-code{font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.65}.campaign-title{font-size:clamp(2rem,7vw,4.5rem);line-height:.9;margin:8px 0 16px}
    .campaign-desc{font-size:1.08rem;line-height:1.6;max-width:650px}.campaign-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.campaign-links a{padding:10px 14px;background:var(--ink);color:var(--off);text-decoration:none;font-weight:900;border:2px solid var(--ink)}
    .campaign-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}.meta-box{padding:14px;border:2px solid var(--ink);background:var(--off)}.meta-box span{display:block;font-size:.7rem;text-transform:uppercase;font-weight:900;opacity:.6;margin-bottom:5px}.meta-box code{word-break:break-all}
    .campaign-state{padding:14px 16px;border:2px solid var(--ink);margin-bottom:20px;font-weight:800}.state-live{background:#BFE3C9}.state-pending{background:#F3D79D}
    .campaign-error{text-align:center;padding:50px 20px}.campaign-error h1{font-size:3rem;margin:0 0 12px}
    @media(max-width:600px){.campaign-card{padding:20px;box-shadow:5px 5px 0 var(--ink)}.campaign-meta{grid-template-columns:1fr}.campaign-top{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="campaign-page"><div class="campaign-shell">
    <div class="campaign-top"><strong class="campaign-brand">GYBS</strong><a class="back-link" href="index.html">← Back to GYBS</a></div>
    <section id="campaign-content" class="campaign-card"><div class="campaign-error"><p>Loading campaign…</p></div></section>
  </div></main>
  <script src="campaign.js"></script>
</body>
</html>
